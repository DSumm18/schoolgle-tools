<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Census Readiness Check — Schoolgle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B12;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:400px;position:relative}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#00D4D4;border:1px solid rgba(0,212,212,0.3);border-radius:20px;padding:4px 10px;margin-bottom:12px}
h2{font-size:20px;line-height:1.3;margin-bottom:18px;font-weight:700}
.checks{list-style:none;margin-bottom:16px}
.checks li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;font-size:14px}
.checks li:hover{border-color:rgba(0,212,212,0.3)}
.checks input[type=checkbox]{width:20px;height:20px;accent-color:#22C55E;cursor:pointer}
.score{text-align:center;font-size:24px;font-weight:800;margin-bottom:16px;transition:color .3s}
.score .label{font-size:13px;font-weight:400;color:#9CA3AF;display:block;margin-top:2px}
.cta{display:block;width:100%;text-align:center;background:#00D4D4;color:#070B12;font-weight:700;font-size:14px;padding:12px;border-radius:10px;text-decoration:none;transition:opacity .2s}
.cta:hover{opacity:0.85}
</style>
</head>
<body>
<div class="card">
  <div class="badge">☕ The Staff Room</div>
  <h2>Spring Census: are you ready?</h2>
  <ul class="checks">
    <li><input type="checkbox" id="c1" onchange="score()"><label for="c1">UPNs verified for all pupils?</label></li>
    <li><input type="checkbox" id="c2" onchange="score()"><label for="c2">FSM eligibility checked?</label></li>
    <li><input type="checkbox" id="c3" onchange="score()"><label for="c3">Absence codes audited?</label></li>
  </ul>
  <div class="score" id="score">0/3 ready<span class="label">Quick readiness check</span></div>
  <a class="cta" href="https://dsumm18.github.io/schoolgle-tools/census-checker.html">Run the Full 20-Point Census Audit →</a>
</div>
<script>
function score(){
  const n=[...document.querySelectorAll('.checks input')].filter(c=>c.checked).length;
  const el=document.getElementById('score');
  el.innerHTML=n+'/3 ready<span class="label">Quick readiness check</span>';
  el.style.color=n===3?'#22C55E':n>=1?'#FBBF24':'#EF4444';
}
score();
</script>
</body>
</html>
