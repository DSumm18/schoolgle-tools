<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 10 — Breakfast Club Calculator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #070B12; --text: #E6EDF3; --muted: #8B949E; --cyan: #00D4D4; --green: #22C55E; --red: #EF4444; --glass: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.08); }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.snippet { max-width: 480px; margin: 1.5rem auto; padding: 1.5rem; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; }
.brand { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.75rem; }
.brand span { color: var(--cyan); }
h2 { font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin-bottom: 1rem; }
h2 em { font-style: normal; color: var(--cyan); }
.controls { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
.slider-row label { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
.slider-row label span { color: var(--text); font-weight: 600; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--cyan); cursor: pointer; border: 2px solid var(--bg); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--cyan); cursor: pointer; border: 2px solid var(--bg); }
.result { text-align: center; padding: 0.75rem; border-radius: 12px; background: rgba(0,212,212,0.06); border: 1px solid rgba(0,212,212,0.2); margin-bottom: 1rem; }
.result .amount { font-size: 1.6rem; font-weight: 700; }
.result .label { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
.surplus .amount { color: var(--green); }
.deficit .amount { color: var(--red); }
.teaser { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
.cta { display: block; text-align: center; padding: 0.75rem; background: linear-gradient(135deg, var(--cyan), #0891b2); color: var(--bg); font-weight: 700; font-size: 0.95rem; text-decoration: none; border-radius: 10px; transition: opacity 0.2s; }
.cta:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="snippet">
  <div class="brand">Schoolgle | <span>The Staff Room</span></div>
  <h2>🥣 Free breakfast clubs start April 2026. <em>Can your school afford it?</em></h2>

  <div class="controls">
    <div class="slider-row">
      <label>Pupils on roll <span id="sv-pupils">420</span></label>
      <input type="range" id="s-pupils" min="100" max="800" value="420" step="10">
    </div>
    <div class="slider-row">
      <label>Expected uptake <span id="sv-uptake">40%</span></label>
      <input type="range" id="s-uptake" min="20" max="80" value="40" step="1">
    </div>
  </div>

  <div class="result" id="s-result">
    <div class="amount" id="s-amount">+£24,510</div>
    <div class="label" id="s-label">Estimated annual surplus</div>
  </div>

  <p class="teaser">Model the full costs including staffing, food, session length, and equipment…</p>

  <a class="cta" href="breakfast-club-calculator.html">Plan Your Breakfast Club →</a>
</div>

<script>
function snippetCalc() {
  const pupils = +document.getElementById('s-pupils').value;
  const uptake = +document.getElementById('s-uptake').value;
  document.getElementById('sv-pupils').textContent = pupils;
  document.getElementById('sv-uptake').textContent = uptake + '%';

  const att = Math.round(pupils * uptake / 100);
  const staff = Math.ceil(att / 20);
  const days = 190;
  const annualStaff = staff * 12.50 * 0.75 * days;
  const annualFood = att * 0.50 * days;
  const totalCost = annualStaff + annualFood;
  const funding = att * 3.50 * days;
  const surplus = funding - totalCost;

  const el = document.getElementById('s-result');
  const amt = document.getElementById('s-amount');
  const lbl = document.getElementById('s-label');

  amt.textContent = (surplus >= 0 ? '+' : '') + '£' + Math.abs(Math.round(surplus)).toLocaleString('en-GB');
  if (surplus >= 0) {
    el.className = 'result surplus';
    lbl.textContent = 'Estimated annual surplus';
  } else {
    el.className = 'result deficit';
    lbl.textContent = 'Estimated annual deficit';
  }
}

document.getElementById('s-pupils').addEventListener('input', snippetCalc);
document.getElementById('s-uptake').addEventListener('input', snippetCalc);
snippetCalc();
</script>
</body>
</html>
