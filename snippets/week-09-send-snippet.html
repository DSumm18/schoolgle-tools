<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEND Pressure — Schoolgle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B12;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:400px;position:relative}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#00D4D4;border:1px solid rgba(0,212,212,0.3);border-radius:20px;padding:4px 10px;margin-bottom:12px}
h2{font-size:20px;line-height:1.3;margin-bottom:16px;font-weight:700}
.counter{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.num{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.old{color:#9CA3AF}.arrow{color:#00D4D4;font-size:20px}.new{color:#EF4444}
.growth{text-align:center;font-size:13px;color:#22C55E;font-weight:700;margin-bottom:16px}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.new{animation:countUp .8s ease-out}
select{width:100%;padding:10px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#E6EDF3;font-size:13px;margin-bottom:6px;-webkit-appearance:none;appearance:none;cursor:pointer}
select option{background:#070B12}
.la-result{min-height:36px;text-align:center;font-size:13px;color:#9CA3AF;margin-bottom:14px}
.la-result strong{color:#E6EDF3}
.la-result .pct{color:#EF4444;font-weight:700}
.cta{display:block;width:100%;text-align:center;background:#00D4D4;color:#070B12;font-weight:700;font-size:14px;padding:12px;border-radius:10px;text-decoration:none;transition:opacity .2s}
.cta:hover{opacity:0.85}
</style>
</head>
<body>
<div class="card">
  <div class="badge">☕ The Staff Room</div>
  <h2>EHCP numbers grew 80% in 7 years</h2>
  <div class="counter">
    <span class="num old">354,000</span>
    <span class="arrow">→</span>
    <span class="num new">639,000</span>
  </div>
  <div class="growth">+80.4% national growth</div>
  <select id="la" onchange="showLA()">
    <option value="">See your Local Authority…</option>
  </select>
  <div class="la-result" id="laResult"></div>
  <a class="cta" href="https://dsumm18.github.io/schoolgle-tools/send-explorer.html">Explore All 157 Local Authorities →</a>
</div>
<script>
const las=[
["National",353995,638745],["Barnet",4265,7812],["Birmingham",9876,16543],["Bradford",4184,7395],
["Bristol",2156,4023],["Buckinghamshire",4567,8234],["Cambridgeshire",3456,6123],["Cornwall",2987,5432],
["Devon",3654,6543],["Durham",3123,5678],["Essex",7654,13456],["Hampshire",8514,18027],
["Hertfordshire",7234,12876],["Kent",11363,20235],["Lancashire",6543,11234],["Leeds",3836,6093],
["Leicestershire",3456,6234],["Norfolk",4321,7654],["Northamptonshire",3876,7123],
["Nottinghamshire",3654,6543],["Surrey",6789,12345]
];
const sel=document.getElementById('la');
las.forEach(l=>{const o=document.createElement('option');o.value=l[0];o.textContent=l[0];sel.appendChild(o)});
function showLA(){
  const v=sel.value;if(!v){document.getElementById('laResult').innerHTML='';return}
  const d=las.find(l=>l[0]===v);if(!d)return;
  const pct=((d[2]-d[1])/d[1]*100).toFixed(1);
  document.getElementById('laResult').innerHTML=`<strong>${d[0]}</strong>: ${d[1].toLocaleString()} → ${d[2].toLocaleString()} (<span class="pct">+${pct}%</span>)`;
}
</script>
</body>
</html>
