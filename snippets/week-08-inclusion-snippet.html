const CATS=['mainstream','special','fe','independent'];
const COLORS={mainstream:'#00D4D4',special:'#A855F7',fe:'#22C55E',independent:'#EF4444'};
const LABELS={mainstream:'Mainstream',special:'Special',fe:'FE',independent:'Independent'};

function pct(v,t){return t>0?(v/t)*100:0}
function getPcts(d){return{mainstream:pct(d.mainstream,d.total),special:pct(d.special,d.total),fe:pct(d.fe,d.total),independent:pct(d.independent,d.total),total:d.total}}

const natP=getPcts(DATA.national['202425']);
const laNames=Object.keys(DATA.las).sort();
const sel=document.getElementById('laSelect');
laNames.forEach(n=>{sel.innerHTML+='<option value="'+n+'">'+n+'</option>'});

function draw(p,label){
  const c=document.getElementById('donut'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,220,220);
  const cx=110,cy=110,r=85,ir=55;
  let s=-Math.PI/2;
  const vals=CATS.map(k=>p[k]||0),tot=vals.reduce((a,b)=>a+b,0)||1;
  CATS.forEach((k,i)=>{
    const a=(vals[i]/tot)*2*Math.PI;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,s+a);ctx.closePath();
    ctx.fillStyle=COLORS[k];ctx.fill();
    if(vals[i]>3){const m=s+a/2,lx=cx+Math.cos(m)*r*0.78,ly=cy+Math.sin(m)*r*0.78;ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(vals[i].toFixed(1)+'%',lx,ly)}
    s+=a;
  });
  ctx.beginPath();ctx.arc(cx,cy,ir,0,2*Math.PI);ctx.fillStyle='#070B12';ctx.fill();
  ctx.fillStyle='#E6EDF3';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText((p.total||0).toLocaleString(),cx,cy-4);
  ctx.fillStyle='#94A3B8';ctx.font='9px sans-serif';ctx.fillText('EHCPs',cx,cy+10);
  document.getElementById('legend').innerHTML=CATS.map(k=>'<div class="legend-item"><div class="legend-dot" style="background:'+COLORS[k]+'"></div>'+LABELS[k]+' '+((p[k]||0).toFixed(1))+'%</div>').join('');
  document.getElementById('label').textContent=label;
}

function update(){
  const name=sel.value;
  if(!name){draw(natP,'National Average (2024-25)');document.getElementById('scoreNum').textContent=natP.mainstream.toFixed(1);document.getElementById('context').textContent='National average across all 157 LAs';return}
  const la=DATA.las[name];
  if(!la||!la['202425'])return;
  const p=getPcts(la['202425']);
  draw(p,name+' (2024-25)');
  document.getElementById('scoreNum').textContent=p.mainstream.toFixed(1);
  const diff=p.mainstream-natP.mainstream;
  document.getElementById('context').textContent=(diff>=0?'+':'')+diff.toFixed(1)+' pp vs national average ('+natP.mainstream.toFixed(1)+'%)';
}

sel.addEventListener('change',update);
draw(natP,'National Average (2024-25)');
document.getElementById('scoreNum').textContent=natP.mainstream.toFixed(1);
document.getElementById('context').textContent='National average across all 157 LAs';
</script>
