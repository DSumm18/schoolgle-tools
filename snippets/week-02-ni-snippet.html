<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NI Rise Impact Calculator — Schoolgle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B12;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:400px;overflow:hidden;position:relative}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#00D4D4;border:1px solid rgba(0,212,212,0.3);border-radius:20px;padding:4px 10px;margin-bottom:12px}
h2{font-size:20px;line-height:1.3;margin-bottom:16px;font-weight:700}
.slider-group{margin-bottom:12px}
.slider-group label{display:flex;justify-content:space-between;font-size:13px;color:#9CA3AF;margin-bottom:4px}
.slider-group label span:last-child{color:#E6EDF3;font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,0.1);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#00D4D4;cursor:pointer}
.result{text-align:center;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px;margin:14px 0}
.result .amount{font-size:28px;font-weight:800;color:#EF4444}
.result .label{font-size:12px;color:#9CA3AF;margin-top:2px}
.stat{font-size:12px;color:#9CA3AF;text-align:center;margin-bottom:14px}
.stat strong{color:#E6EDF3}
.cta{display:block;width:100%;text-align:center;background:#00D4D4;color:#070B12;font-weight:700;font-size:14px;padding:12px;border-radius:10px;text-decoration:none;transition:opacity .2s}
.cta:hover{opacity:0.85}
</style>
</head>
<body>
<div class="card">
  <div class="badge">☕ The Staff Room</div>
  <h2>The NI rise hits schools harder than you think</h2>
  <div class="slider-group">
    <label>Staff count <span id="staffVal">150</span></label>
    <input type="range" id="staff" min="20" max="400" value="150" oninput="calc()">
  </div>
  <div class="slider-group">
    <label>Avg salary <span id="salVal">£30,000</span></label>
    <input type="range" id="sal" min="20000" max="60000" step="1000" value="30000" oninput="calc()">
  </div>
  <div class="result">
    <div class="amount" id="cost">£54,000</div>
    <div class="label">Additional annual NI cost</div>
  </div>
  <p class="stat">A <strong>150-staff</strong> school faces an extra <strong>£54,000</strong> per year</p>
  <a class="cta" href="https://dsumm18.github.io/schoolgle-tools/ni-calculator.html">Calculate Your School's NI Impact →</a>
</div>
<script>
function calc(){
  const s=document.getElementById('staff').value;
  const sal=document.getElementById('sal').value;
  document.getElementById('staffVal').textContent=s;
  document.getElementById('salVal').textContent='£'+Number(sal).toLocaleString();
  // 1.2% increase on salaries above £9,100 threshold
  const extra=Math.round(s*Math.max(0,(sal-9100)*0.012));
  document.getElementById('cost').textContent='£'+extra.toLocaleString();
}
</script>
</body>
</html>
